name: Respaldo semanal

# Exporta Firestore (proyecto real) a un archivo JSONL comprimido y lo guarda como artefacto
# por 30 días (los respaldos administrados de Firestore requieren plan de pago).
#
# Privacidad (Ley 29733): en un repositorio público cualquiera con cuenta de GitHub puede
# descargar los artefactos. Por eso:
#   - con el secret BACKUP_PASSPHRASE: respaldo COMPLETO (incluye usuarios), cifrado AES-256;
#   - sin él: SOLO el catálogo (sin datos personales), sin cifrar.
on:
  schedule:
    - cron: "0 8 * * 0"   # domingos 08:00 UTC (03:00 en Lima)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secret FIREBASE_SERVICE_ACCOUNT. No se hace el respaldo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt

      - name: Exportar
        if: steps.creds.outputs.ready == 'true'
        working-directory: scraping-engine
        run: |
          pip install -r requirements.txt
          if [ -n "$BACKUP_PASSPHRASE" ]; then
            python -m app.backup.export ../respaldo --include-users --prod --yes
          else
            echo "::notice::Sin BACKUP_PASSPHRASE: se respalda solo el catálogo (sin datos personales)."
            python -m app.backup.export ../respaldo --prod --yes
          fi

      - name: Cifrar (respaldo completo)
        if: steps.creds.outputs.ready == 'true' && env.BACKUP_PASSPHRASE != ''
        run: |
          tar -czf respaldo.tar.gz respaldo
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in respaldo.tar.gz \
            -out respaldo.tar.gz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf respaldo respaldo.tar.gz
          mkdir respaldo && mv respaldo.tar.gz.enc respaldo/

      - name: Resumen
        if: steps.creds.outputs.ready == 'true'
        run: |
          echo "## Respaldo de Firestore" >> "$GITHUB_STEP_SUMMARY"
          if [ -f respaldo/manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat respaldo/manifest.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Respaldo completo cifrado (AES-256). Ver README para descifrarlo." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: respaldo-firestore-${{ github.run_id }}
          path: respaldo/
          retention-days: 30
