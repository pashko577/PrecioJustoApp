name: Scraping

# Extracción programada contra el proyecto REAL (precio-justo-pe).
# Requiere el secret FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio).
# Si el secret no existe, el job avisa y termina sin hacer nada.
on:
  schedule:
    - cron: "15 */6 * * *"   # cada 6 horas (UTC). En Lima: 19:15, 01:15, 07:15 y 13:15
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Páginas por categoría (vacío = todas)"
        required: false
        default: ""
      recheck:
        description: "Revisar asociaciones existentes con las reglas nuevas al terminar"
        type: boolean
        required: false
        default: false
      catalogo_completo:
        description: "Rearmar el catálogo de la app desde cero (lee todo Firestore)"
        type: boolean
        required: false
        default: false
      catalogo_desde_corrida:
        description: "Solo publicar el catálogo con las tiendas de otra corrida (su número de ID; no extrae)"
        required: false
        default: ""

concurrency:
  group: scraping-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Tiendas activas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spiders: ${{ steps.list.outputs.spiders }}
    steps:
      - uses: actions/checkout@v5
      # Lee stores.json sin dependencias externas: solo tiendas con scrapingEnabled.
      - id: list
        run: |
          SPIDERS=$(python3 -c "import json;print(json.dumps([s['spider'] for s in json.load(open('scraping-engine/app/data/stores.json',encoding='utf-8')) if s.get('scrapingEnabled') and s.get('spider')]))")
          echo "Tiendas activas: $SPIDERS"
          echo "spiders=$SPIDERS" >> "$GITHUB_OUTPUT"

  # Una sola vez por corrida (antes se repetía en cada tienda). Solo escribe lo que cambió:
  # normalmente 0 escrituras. Si falla (por ejemplo, cuota agotada), no se lanzan las tiendas.
  sync:
    name: Sincronizar categorías y tiendas
    needs: plan
    # Con «catalogo_desde_corrida» no se extrae: solo se publica el catálogo (job «catalog»).
    if: ${{ !github.event.inputs.catalogo_desde_corrida }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-python@v6
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt
      - name: Sincronizar (solo cambios)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: scraping-engine
        run: |
          pip install -r requirements.txt
          python -m app.admin.categories --prod --yes
          python -m app.admin.stores --prod --yes
          python -m app.admin.images --prod --yes

  scrape:
    name: Scraping ${{ matrix.spider }}
    needs: [plan, sync]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1   # una tienda a la vez
      matrix:
        spider: ${{ fromJSON(needs.plan.outputs.spiders) }}
    env:
      JOB_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      MAX_PAGES: ${{ github.event.inputs.max_pages }}
    steps:
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secret FIREBASE_SERVICE_ACCOUNT. No se ejecuta el scraping (ver README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt

      - name: Instalar dependencias
        if: steps.creds.outputs.ready == 'true'
        working-directory: scraping-engine
        run: pip install -r requirements.txt

      # Copia de trabajo del motor (app/state.py): evita releer productos y publicaciones.
      # Sin copia (primera vez o vencida), el motor lee Firestore como antes.
      - name: Restaurar copia de trabajo
        if: steps.creds.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: engine-state
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-

      - name: Ejecutar spider
        if: steps.creds.outputs.ready == 'true'
        working-directory: scraping-engine
        env:
          ENGINE_STATE: ${{ github.workspace }}/engine-state/engine-state.json.gz
          ENGINE_STATE_OUT: ${{ github.workspace }}/state-out
        run: |
          ARGS=""
          if [ -n "$MAX_PAGES" ]; then ARGS="-a max_pages=$MAX_PAGES"; fi
          scrapy crawl ${{ matrix.spider }} $ARGS -L INFO

      - name: Guardar publicaciones finales de la tienda
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.spider }}
          path: state-out/
          if-no-files-found: ignore
          retention-days: 1

  status:
    name: Estado del sistema
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-python@v6
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt
      - name: Revisar asociaciones con las reglas nuevas
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && github.event.inputs.recheck == 'true'
        working-directory: scraping-engine
        run: |
          pip install -r requirements.txt
          set +e
          python -m app.admin.review_matches recheck --prod --yes > recheck.txt 2>&1
          code=$?
          cat recheck.txt
          { echo "### Asociaciones enviadas a revisión"; echo '```'; head -100 recheck.txt; tail -30 recheck.txt | grep -A30 -m1 Traceback; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Resumen
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: scraping-engine
        run: |
          pip install -r requirements.txt
          set +e
          python -m app.admin.status --markdown --prod --yes > estado.md 2> estado.err
          code=$?
          cat estado.md >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then
            cat estado.err
            { echo; echo '```'; tail -30 estado.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::El resumen del sistema falló (ver el error en el resumen)."
          fi
          if [ $code -eq 2 ]; then echo "::warning::Hay tiendas desactualizadas (ver resumen)."; fi
          exit 0

  # Catálogo público para la app (catalog.json en GitHub Pages): la app navega y busca desde su
  # copia local, sin lecturas de Firestore. Incremental: solo lee lo que cambió desde la versión
  # publicada. Completo los domingos en la corrida de las 12:15 UTC (inicio del día de cuota), o a
  # pedido. Si no hay cupo diario de lecturas, se mantiene la versión publicada.
  catalog:
    name: Publicar catálogo de la app
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # descargar las publicaciones finales de las tiendas (también de otra corrida)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CATALOG_URL: https://pashko577.github.io/PrecioJustoApp/catalog.json
    steps:
      - name: Verificar credenciales
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Falta el secret FIREBASE_SERVICE_ACCOUNT; no se publica el catálogo."
      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/setup-python@v6
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt
      - name: Restaurar copia de trabajo
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/cache/restore@v4
        with:
          path: engine-state
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Publicaciones finales de cada tienda
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true   # sin tiendas en esta corrida no hay artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: state-*
          path: state-out
          merge-multiple: true
          run-id: ${{ github.event.inputs.catalogo_desde_corrida || github.run_id }}
          github-token: ${{ github.token }}
      - name: Exportar catálogo
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: scraping-engine
        run: |
          pip install -r requirements.txt
          rm -f ../engine-state/.updated
          # Precios de lo aprobado en la app (pantalla «Revisar asociaciones»); sin pendientes, 1 lectura.
          python -m app.admin.review_matches apply-app-decisions --prod --yes             || echo "::warning::No se pudieron aplicar las decisiones de la app; se reintenta en la próxima corrida."
          FULL=""
          if [ "${{ github.event.inputs.catalogo_completo }}" = "true" ]; then FULL="--full"; fi
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "12" ]; then FULL="--full"; fi
          python -m app.export.catalog --prod --yes $FULL --out ../site/catalog.json --previous-url "$CATALOG_URL" --state ../engine-state/engine-state.json.gz --store-states ../state-out | tee export.txt
          mkdir -p ../site && touch ../site/.nojekyll
          { echo "### Catálogo de la app"; cat export.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar copia de trabajo
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && hashFiles('engine-state/.updated') != ''
        uses: actions/cache/save@v4
        with:
          path: engine-state
          key: engine-state-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && hashFiles('site/catalog.json') != ''
        with:
          path: site
      - id: deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && hashFiles('site/catalog.json') != ''
        uses: actions/deploy-pages@v4
