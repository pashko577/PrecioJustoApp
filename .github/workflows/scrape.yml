name: Scraping

# Sprint 1: solo ejecución manual contra el EMULADOR con la tienda demo (HTML local).
# Sprint 4: activar el cron y usar el proyecto real con el secret FIREBASE_SERVICE_ACCOUNT.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "15 */6 * * *"   # cada 6 horas (hora UTC)

concurrency:
  group: scraping
  cancel-in-progress: false

jobs:
  scrape:
    name: Scraping ${{ matrix.spider }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spider: [demo_store]
    env:
      JOB_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-engine/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools
      - run: pip install -r scraping-engine/requirements.txt

      - name: Ejecutar spider contra el emulador
        run: |
          firebase emulators:exec --only firestore --project demo-precio-justo \
            "cd scraping-engine && python -m app.admin.seed && scrapy crawl ${{ matrix.spider }}"

      # Producción (sprint 4): reemplazar el paso anterior por este.
      # - name: Ejecutar spider en producción
      #   working-directory: scraping-engine
      #   env:
      #     FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      #   run: scrapy crawl ${{ matrix.spider }}
