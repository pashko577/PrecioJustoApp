<!DOCTYPE html>
<!-- Página FICTICIA con la estructura de un listado Magento. No representa ninguna tienda real. -->
<html lang="es"><body>
<div class="toolbar"><span class="toolbar-number">1</span>-<span class="toolbar-number">24</span> de <span class="toolbar-number">53</span></div>
<ol class="products list items product-items">
  <li class="item product product-item item-1 ">
    <div class="product-item-info " id="product-item-info_1001" data-container="product-grid">
      <div class="badge"><ul><li class="top-left">25%</li></ul></div>
      <strong class="product name product-item-name">
        <a class="product-item-link" href="https://tienda.example.com/refrigeradora-demo-rx-280-plus.html" data-ts-clickable>
          Refrigeradora Coldex 263LT NF RX280PLUS
        </a>
      </strong>
      <div class="price-box price-final_price" data-role="priceBox" data-product-id="1001">
        <span id="product-price-1001" data-price-amount="1099" data-price-type="finalPrice" class="price-wrapper "><span class="price">S/ 1,099.00</span></span>
        <span id="old-price-1001" data-price-amount="1699" data-price-type="oldPrice" class="price-wrapper "><span class="price">S/ 1,699.00</span></span>
      </div>
      <form class="tocart-form" data-role="tocart-form" data-product-sku="RX 280 PLUS" data-product-id="1001" action="#"></form>
    </div>
  </li>
  <li class="item product product-item item-2 ">
    <div class="product-item-info " id="product-item-info_1002">
      <strong class="product name product-item-name">
        <a class="product-item-link" href="https://tienda.example.com/laptop-demo.html">Laptop Lenovo IdeaPad Demo 15 Ryzen 5 16GB 512GB</a>
      </strong>
      <div class="price-box price-final_price" data-product-id="1002">
        <span id="product-price-1002" data-price-amount="2299.9" data-price-type="finalPrice" class="price-wrapper "></span>
      </div>
      <div class="stock unavailable"><span>Agotado</span></div>
      <a class="action tocompare" data-product-sku="83ER00ABLM" data-product-id="1002"></a>
    </div>
  </li>
  <li class="item product product-item item-3 ">
    <div class="product-item-info " id="product-item-info_1003">
      <strong class="product name product-item-name">
        <a class="product-item-link" href="https://tienda.example.com/celular-reacondicionado.html">Celular Samsung Galaxy Demo 128GB Reacondicionado</a>
      </strong>
      <div class="price-box price-final_price" data-product-id="1003">
        <span id="product-price-1003" data-price-amount="599" data-price-type="finalPrice" class="price-wrapper "></span>
      </div>
      <form class="tocart-form" data-role="tocart-form" data-product-sku="SM-DEMO128" data-product-id="1003" action="#"></form>
    </div>
  </li>
  <li class="item product product-item item-4 ">
    <div class="product-item-info " id="product-item-info_1004">
      <strong class="product name product-item-name">
        <a class="product-item-link" href="https://tienda.example.com/sin-precio.html">Producto sin precio</a>
      </strong>
      <form class="tocart-form" data-role="tocart-form" data-product-sku="SINPRECIO" data-product-id="1004" action="#"></form>
    </div>
  </li>
</ol>
<!-- Bloque fuera de la lista: no debe contaminar al último producto. -->
<div class="block widget recently-viewed">
  <span data-price-amount="1" data-price-type="finalPrice"></span>
  <span data-price-amount="2" data-price-type="oldPrice"></span>
</div>
</body></html>
